[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sage"
version = "0.1.0"
description = "Local-first agentic AI coding assistant"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "docker>=7.0",
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
    "langgraph>=0.2",
    "langchain-core>=0.2",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-go>=0.23",
    "gitpython>=3.1",
    "unidiff>=0.7",
    "tavily-python>=0.3",
    "numpy>=1.26",
    "patch-ng>=1.17",
]

[project.scripts]
sage = "sage.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
include = ["sage/**"]

[tool.hatch.build.force-include]
"sage/docker/docker-compose.yml" = "sage/docker/docker-compose.yml"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
